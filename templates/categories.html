<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
</head>
<body>
<a href="{{ url_for('dashboard') }}">&larr; Dashboard</a>
<h1>Categories</h1>

{% if error %}
<div class="error-box">
    <ul>
        {% for e in error %}
        <li>{{ e }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<section class="filters">
    <form method="get" action="{{ url_for('categories_page') }}">
        <input type="text" name="keyword" placeholder="Search by name" value="{{ keyword }}">
        <button type="submit">Search</button>
        {% if keyword %}
        <a href="{{ url_for('categories_page') }}">Clear</a>
        {% endif %}
    </form>
</section>

<table class="data-table">
    <thead>
    <tr><th>ID</th><th>Name</th><th></th></tr>
    </thead>
    <tbody>
    {% for cat in categories %}
    <tr>
        <td>{{ cat.id }}</td>
        <td>{{ cat.name }}</td>
        <td>
            <form method="post" action="{{ url_for('update_category_route', category_id=cat.id) }}" style="display:inline">
                <input type="text" name="name" placeholder="New name" required style="width:120px">
                <button type="submit">Rename</button>
            </form>
            <form method="post" action="{{ url_for('delete_category_route', category_id=cat.id) }}"
                  onsubmit="return confirm('Delete this category? Any linked transactions/budgets/investments will keep their old category_id pointing nowhere.');"
                  style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% else %}
    <tr><td colspan="3">No categories found.</td></tr>
    {% endfor %}
    </tbody>
</table>

<h2>Add Category</h2>
<form method="post" action="{{ url_for('add_category_route') }}" class="add-form">
    <input type="text" name="name" placeholder="Category name" required>
    <button type="submit">Add Category</button>
</form>
</body>
</html>
